services:
  - type: web
    name: portfolio-backend
    runtime: docker
    plan: free
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
