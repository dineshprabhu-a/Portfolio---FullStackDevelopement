server.port=${PORT:8080}

# ===== H2 Database =====
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:portfoliodb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ===== Mail Configuration =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Portfolio owner email
portfolio.contact.recipient=dineshprabhu02ece@gmail.com

# ===== Google reCAPTCHA v3 =====
recaptcha.secret=${RECAPTCHA_SECRET:your-recaptcha-secret-key}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.enabled=${RECAPTCHA_ENABLED:false}

# ===== GitHub Integration =====
github.username=dineshprabhu-a
github.api-url=https://api.github.com
github.token=${GITHUB_TOKEN:}

# ===== Resume =====
resume.file-path=src/main/resources/static/resume.pdf

# ===== Caching =====
spring.cache.type=simple
